name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only one deployment at a time; let in-flight runs finish instead of racing them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate offline demo (fixture data, no database)
        run: npm run generate
        env:
          DEMO: 'true'
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          SERVER_NAME: Demo KZ Server
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
