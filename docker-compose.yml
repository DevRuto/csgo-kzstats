services:
  mariadb:
    image: mariadb:11.4
    container_name: kzlocal-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: kzstats
      MYSQL_PASSWORD: local
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init/00-init-user.sql:/docker-entrypoint-initdb.d/00-init-user.sql:ro
      - ./db/gokz.sql:/docker-entrypoint-initdb.d/10-gokz.sql:ro
      - ./db/kztimer.sql:/docker-entrypoint-initdb.d/20-kztimer.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
